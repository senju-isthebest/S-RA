name: SŌRA Cross-Platform CI

on:
  push:
    branches: [ main, master, feature/ai-provider-router ]
  pull_request:
    branches: [ main, master ]

jobs:
  android:
    name: Android Build & Unit/Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android Debug Build & Unit/Robolectric Tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

  web-pwa:
    name: Web / PWA TypeCheck, Vitest & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows-desktop:
    name: Windows Electron TypeCheck & Unit Tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: windows/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  firestore-rules:
    name: Firestore Security Rules Emulator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI & Rules Unit Testing
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore Rules Tests
        run: npx firebase emulators:exec --only firestore "node --test firestore.test.js"

  secret-hygiene:
    name: Source Secret & Key Hygiene Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan production sources for committed API keys or private keys
        run: |
          if grep -rnE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|EC|OPENSSH|PRIVATE) PRIVATE KEY' app/src/main web/src windows/src; then
            echo "Potential committed secret detected in production source!"
            exit 1
          fi

